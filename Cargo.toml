[package]
name = "tapewave"
version = "0.2.0"
edition = "2024"

[workspace]
members = ["engine"]

[dependencies]
tapewave-engine = { path = "engine" }
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "wgpu_no_default_features", "accesskit", "persistence"] }
wgpu = { version = "30", default-features = false, features = ["std", "dx12", "wgsl", "parking_lot"] }
rfd = "0.17.2"
lofty = "0.22"
walkdir = "2"
raw-window-handle = "0.6"
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.serde_json]
version = "1"

[build-dependencies]
embed-resource = "3"

[profile.release]
lto = "thin"
strip = true

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
