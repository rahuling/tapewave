<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tapewave</title>
  <style>
    :root { --bg: #1b1d22; --panel: #262932; --text: #d8dde6; --dim: #7d8594; --accent: #6fd39a; --err: #e5707e; }
    @media (prefers-color-scheme: light) {
      :root { --bg: #eceef2; --panel: #ffffff; --text: #1d2026; --dim: #6b7280; --accent: #1f9d63; --err: #c2394b; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
    main { padding: 16px; display: grid; gap: 12px; }
    .display { background: var(--panel); border-radius: 8px; padding: 12px; min-height: 84px; }
    .state { color: var(--accent); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
    .source { word-break: break-all; margin-top: 4px; }
    .error { color: var(--err); margin-top: 6px; font-size: 13px; }
    .transport { display: flex; gap: 8px; }
    button { flex: 1; padding: 10px; border: 0; border-radius: 6px; background: var(--panel); color: var(--text); font: inherit; cursor: pointer; }
    button:hover { filter: brightness(1.1); }
    .panel { background: var(--panel); border-radius: 8px; padding: 12px; display: grid; gap: 8px; }
    .panel h2 { font-size: 12px; margin: 0; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; }
    .row { display: flex; gap: 8px; }
    input[type=text] { flex: 1; min-width: 0; padding: 8px; border-radius: 6px; border: 1px solid var(--dim); background: var(--bg); color: var(--text); font: inherit; }
    ul { list-style: none; margin: 0; padding: 0; max-height: 240px; overflow-y: auto; }
    li button { text-align: left; width: 100%; flex: none; }
    li button span { display: block; color: var(--dim); font-size: 12px; }
    input[type=range] { width: 100%; }
  </style>
</head>
<body>
<main>
  <section class="display" aria-live="polite">
    <div class="state" id="state">stopped</div>
    <div class="source" id="source">Nothing playing</div>
    <div class="error" id="error" hidden></div>
  </section>

  <section class="transport">
    <button id="play" title="Play / pause">Play / Pause</button>
    <button id="stop" title="Stop">Stop</button>
  </section>

  <label class="panel">
    <h2>Volume</h2>
    <input type="range" id="volume" min="0" max="1" step="0.01" value="1">
  </label>

  <section class="panel">
    <h2>Local file</h2>
    <div class="row">
      <input type="text" id="file-path" placeholder="C:\Music\track.mp3">
      <button id="play-file">Open</button>
    </div>
  </section>

  <section class="panel">
    <h2>Radio stream</h2>
    <div class="row">
      <input type="text" id="stream-url" placeholder="https://.../stream.mp3">
      <button id="play-stream">Play</button>
    </div>
  </section>

  <section class="panel">
    <h2>Podcast feed</h2>
    <div class="row">
      <input type="text" id="feed-url" placeholder="https://.../feed.xml">
      <button id="load-feed">Load</button>
    </div>
    <div id="feed-title"></div>
    <ul id="episodes"></ul>
  </section>
</main>

<script>
  const invoke = window.__TAURI__.core.invoke;
  const $ = (id) => document.getElementById(id);

  async function call(cmd, args) {
    try {
      return await invoke(cmd, args);
    } catch (e) {
      showError(String(e));
    }
  }

  function showError(message) {
    $('error').textContent = message;
    $('error').hidden = !message;
  }

  async function refresh() {
    const s = await invoke('status');
    $('state').textContent = s.state;
    $('source').textContent = s.source ?? 'Nothing playing';
    $('volume').value = s.volume;
    showError(s.error);
  }

  $('play').onclick = async () => {
    const s = await invoke('status');
    await call(s.state === 'playing' ? 'pause' : 'resume');
    refresh();
  };
  $('stop').onclick = () => call('stop').then(refresh);
  $('volume').oninput = (e) => call('set_volume', { volume: Number(e.target.value) });

  $('play-file').onclick = () => call('play_file', { path: $('file-path').value.trim() }).then(refresh);
  $('play-stream').onclick = () => call('play_url', { url: $('stream-url').value.trim() }).then(refresh);

  $('load-feed').onclick = async () => {
    const podcast = await call('fetch_podcast', { feedUrl: $('feed-url').value.trim() });
    if (!podcast) return;
    $('feed-title').textContent = podcast.title;
    const list = $('episodes');
    list.replaceChildren();
    for (const ep of podcast.episodes) {
      const li = document.createElement('li');
      const btn = document.createElement('button');
      btn.textContent = ep.title;
      const date = document.createElement('span');
      date.textContent = ep.published ?? '';
      btn.appendChild(date);
      btn.onclick = () => call('play_url', { url: ep.audioUrl }).then(refresh);
      li.appendChild(btn);
      list.appendChild(li);
    }
  };

  setInterval(refresh, 500);
  refresh();
</script>
</body>
</html>
